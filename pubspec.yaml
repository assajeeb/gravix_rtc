name: gravix_rtc
description: >-
  Real-time video and audio rooms for Flutter on Gravix Cloud: one room
  service, region-aware connect, token providers, join analytics and a
  video-effect hook.
version: 0.4.9
homepage: https://gravitycompile.com
repository: https://github.com/assajeeb/gravix_rtc
issue_tracker: https://github.com/assajeeb/gravix_rtc/issues
topics:
  - webrtc
  - video-call
  - audio
  - realtime
  - rtc

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Vendored RTC core (lib/src/rtc_core) — do NOT add a separate
  # third-party RTC client package here; that code ships in-tree.
  # 1.6.x: tested at both ends -- 1.6.0 (CI job "test (lower bounds)") and
  # 1.6.2+hotfix.3 (what a fresh `pub get` resolves; libwebrtc 150, WARP); the
  # Android example APK is built against 1.6.2+hotfix.3. Exact 1.6.0 pin up to 0.4.7,
  # which forced apps onto 1.6.0 or into a dependency_overrides. <1.7.0: the
  # vendored core and the native plugin code reach into flutter_webrtc internals,
  # so a minor bump needs its own validation first.
  flutter_webrtc: '>=1.6.0 <1.7.0'
  dart_webrtc: ^1.8.0
  asn1lib: ^1.6.5
  async: ^2.13.0
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.0
  fixnum: ^1.1.1
  meta: ^1.17.0
  http: ^1.6.0
  logging: ^1.3.0
  uuid: ^4.5.3
  synchronized: ^3.4.0
  protobuf: ^6.0.0
  device_info_plus: ">=12.3.0 <14.0.0"
  sdp_transform: ^0.3.2
  web: ^1.1.1
  mime_type: ^1.0.1
  path: ^1.9.1
  dart_jsonwebtoken: ^3.3.2
  json_annotation: ^4.12.0

  # App-facing layers (room service)
  # 0.1.21+ and 0.2.x: the SDK reads getCommunicationDevice() null-safely, the one
  # API whose type changed in 0.2 (CI runs the tests against both lines).
  audio_session: '>=0.1.21 <0.3.0'
  # Persists the start-up region list across launches (GravixSharedPrefsRegionListStore).
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Deterministic timer control for the audio-routing ladder/debounce tests.
  fake_async: ^1.3.1
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  # Narrow pin so the committed json codegen stays deterministic across machines
  json_serializable: ">=6.14.1 <6.15.0"
  build_runner: ^2.4.13

flutter:
  plugin:
    platforms:
      android:
        package: com.gravitycompile.gravix_cloud
        pluginClass: GravixCloudPlugin
      ios:
        pluginClass: GravixCloudPlugin
