include: package:flutter_lints/flutter.yaml

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options

analyzer:
  errors:
    # Vendored RTC core is upstream code — keep its own style.
    constant_identifier_names: ignore
    use_super_parameters: ignore
    avoid_print: ignore
    deprecated_member_use_from_same_package: ignore
    # audio_session's AudioDeviceType is marked @experimental but is the
    # supported way to enumerate route types.
    experimental_member_use: ignore

  # Exclude generated protobuf files
  exclude:
    - "**/*.pb.dart"
    - "**/*.pbenum.dart"
    - "**/*.pbjson.dart"
    - "**/*.pbserver.dart"
    - build/**
    - example/build/**
    - android/**
    - ios/**

linter:
  rules:
    # Vendored RTC core uses ``${expr}`` heavily; keep it consistent.
    unnecessary_brace_in_string_interps: false

formatter:
  page_width: 120
